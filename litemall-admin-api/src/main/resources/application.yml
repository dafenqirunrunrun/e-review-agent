spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  profiles:
    active: db, core, admin
  messages:
    encoding: UTF-8

server:
  port: 8083

document-library:
  root: storage/document-library
  index-root: storage/document-library/policy-index
  pipeline-version: document-parse-v2
  base-policy-index: ai-service/data/policy_rag_real/index/policy_chunks.jsonl
  python: ai-service/.venv/Scripts/python.exe
  index-script: ai-service/scripts/document_index_worker.py

logging:
  level:
    root:  ERROR
    org.springframework:  ERROR
    org.mybatis:  ERROR
    org.linlinjava.litemall.admin:  DEBUG
    org.linlinjava.litemall:  ERROR

swagger:
  production: false
