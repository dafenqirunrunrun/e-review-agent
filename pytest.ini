[pytest]
markers =
    real_dense: tests that require a real local BGE-M3 model asset.
    requires_model_asset: tests that require a repo-external model directory.
    requires_faiss: tests that require faiss to be importable.
    requires_cuda: tests that require CUDA availability.
    bge_reference: tests that require optional BGE reference provider dependencies.
    real_reranker: tests that require a real local reranker model asset.
    real_reranker_runtime: tests that require the formal Agent-RAG runtime to execute a real local reranker.
    real_llm: tests that require a real local Qwen3 model asset.
    real_llm_runtime: tests that require the formal Agent-RAG runtime to execute a real local Qwen3 model.
    real_model_chain: tests that require the full local real model chain.
    real_sparse: tests that require a real local BGE-M3 sparse runtime environment.
