# E-Review Agent v2.0 local Spring profile example.
# Copy to a private local config directory and keep secrets outside Git.

server:
  port: ${E_REVIEW_ADMIN_API_PORT:8083}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:litemall}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&verifyServerCertificate=false&useSSL=false
    username: ${MYSQL_USER:litemall}
    password: ${MYSQL_PWD:}

agent-rag:
  enabled: ${AGENT_RAG_ENABLED:true}
  target-mode: ${AGENT_RAG_TARGET_MODE:enterprise-maturity-local-single-node}
  runtime-mode: ${AGENT_RAG_RUNTIME_MODE:local-model}
  ai-base-url: ${E_REVIEW_AI_BASE_URL:http://127.0.0.1:8008}
  rule-fallback-enabled: ${RAG_RULE_FALLBACK_ENABLED:true}

logging:
  file:
    path: ${E_REVIEW_RUNTIME_HOME:${user.home}/.e-review-agent/runtime}/logs

