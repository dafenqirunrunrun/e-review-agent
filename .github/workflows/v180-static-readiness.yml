name: v1.8 static readiness

on:
  pull_request:
  workflow_dispatch:

jobs:
  static-readiness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Block tracked model and index binaries
        shell: pwsh
        run: |
          $patterns = '\.safetensors$|\.bin$|\.gguf$|\.ckpt$|\.onnx$|\.pt$|\.pth$|\.faiss$|^models/|^data-private/|^data/real_world/raw_private/'
          $hits = git ls-files | Select-String -Pattern $patterns
          if ($hits) {
            $hits | ForEach-Object { Write-Host $_.Line }
            throw "Tracked model/index/private-data artifact detected"
          }

      - name: Compile Python source
        run: python -m compileall ai-service/app ai-service/scripts

      - name: Check required v1.8 evidence files
        shell: pwsh
        run: |
          $required = @(
            "state/v180_readiness_progress.json",
            "data/private_research/audit/v180_v170_truth_audit.json",
            "data/private_research/audit/v180_local_embedding_inventory.json",
            "data/private_research/audit/v180_failure_injection.json",
            "data/private_research/audit/v180_performance_soak.json",
            "docs/enterprise/v180_real_retrieval_eval.md",
            "docs/enterprise/v180_failure_injection.md",
            "docs/enterprise/v180_performance_soak.md"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required evidence file: $path"
            }
          }
